<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <!-- Vibrant Accents -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fd0461" />
      <stop offset="35%" stop-color="#a855f7" />
      <stop offset="70%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fd0461" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.85" />
    </linearGradient>

    <!-- TV Frame Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
      50% { transform: scale(1.15) translate(25px, -15px); opacity: 0.65; }
      100% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
    }
    @keyframes scanlineMove {
      0% { transform: translateY(0px); opacity: 0.15; }
      50% { opacity: 0.4; }
      100% { transform: translateY(180px); opacity: 0.15; }
    }
    @keyframes floatCard {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes signalWave {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -120; }
    }
    .orb-anim {
      animation: pulseOrb 8s ease-in-out infinite;
      transform-origin: center;
    }
    .card-float-1 {
      animation: floatCard 6s ease-in-out infinite;
    }
    .card-float-2 {
      animation: floatCard 7s ease-in-out infinite 1.5s;
    }
    .card-float-3 {
      animation: floatCard 5.5s ease-in-out infinite 0.8s;
    }
    .scan-line {
      animation: scanlineMove 4s linear infinite;
    }
    .signal-line {
      stroke-dasharray: 8, 8;
      animation: signalWave 3s linear infinite;
    }
  </style>

  <!-- Deep Workspace Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Grid Tech Mesh in Background -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Dynamic Glowing Atmospheric Orbs (Background layer) -->
  <circle cx="150" cy="100" r="140" fill="url(#glowGrad)" class="orb-anim" filter="url(#neonGlow)" />
  <circle cx="1080" cy="260" r="160" fill="url(#glowGrad)" class="orb-anim" style="animation-delay: -4s;" filter="url(#neonGlow)" />

  <!-- Animated Wave Line in Background -->
  <path d="M 0,280 Q 300,200 600,280 T 1200,270" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.25" class="signal-line" />

  <!-- Right Side Interactive TV / Homebrew Display Illustration -->
  <g transform="translate(860, 45)">
    <!-- Smart TV Display Chassis -->
    <rect x="0" y="0" width="280" height="175" rx="10" fill="#030712" stroke="#374151" stroke-width="3" filter="url(#badgeShadow)" />
    <!-- TV Screen Inner -->
    <rect x="6" y="6" width="268" height="163" rx="6" fill="#0d1117" />
    <!-- Screen Ambient Glow Corner -->
    <rect x="6" y="6" width="268" height="163" rx="6" fill="url(#glowGrad)" opacity="0.3" />

    <!-- Animated Scanline on Screen -->
    <line x1="6" y1="10" x2="274" y2="10" stroke="#38bdf8" stroke-width="2" class="scan-line" opacity="0.3" />

    <!-- Mock TV Launcher Tiles -->
    <!-- Tile 1: Homebrew Channel -->
    <rect x="18" y="24" width="66" height="52" rx="6" fill="#fd0461" fill-opacity="0.2" stroke="#fd0461" stroke-width="1.2" />
    <circle cx="51" cy="45" r="10" fill="#fd0461" />
    <text x="51" y="49" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="9" fill="#ffffff" font-weight="bold" text-anchor="middle">HB</text>
    <text x="51" y="68" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="7.5" fill="#e5e7eb" text-anchor="middle">Store</text>

    <!-- Tile 2: Luma Launcher -->
    <rect x="94" y="24" width="66" height="52" rx="6" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="1.2" />
    <polygon points="127,38 137,54 117,54" fill="#8b5cf6" />
    <text x="127" y="68" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="7.5" fill="#e5e7eb" text-anchor="middle">Launcher</text>

    <!-- Tile 3: Moonlight Stream -->
    <rect x="170" y="24" width="80" height="52" rx="6" fill="#06b6d4" fill-opacity="0.2" stroke="#06b6d4" stroke-width="1.2" />
    <path d="M 205,42 A 8,8 0 0,0 215,50 A 10,10 0 1,1 205,42 Z" fill="#06b6d4" />
    <text x="210" y="68" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="7.5" fill="#e5e7eb" text-anchor="middle">Moonlight</text>

    <!-- Row 2: Media & System -->
    <rect x="18" y="86" width="108" height="42" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="32" y="111" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="9" fill="#38bdf8" font-weight="bold">Kodi &amp; Jellyfin</text>

    <rect x="134" y="86" width="116" height="42" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="146" y="111" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="9" fill="#10b981" font-weight="bold">SSH / DevMode: ON</text>

    <!-- TV Stand Base -->
    <polygon points="120,175 160,175 166,198 114,198" fill="#1f2937" />
    <rect x="90" y="198" width="100" height="5" rx="2.5" fill="#374151" />
  </g>

  <!-- Floating Feature Badges (Decorations on Right) -->
  <g class="card-float-1" transform="translate(800, 240)">
    <rect x="0" y="0" width="124" height="34" rx="8" fill="url(#pillGrad)" stroke="#fd0461" stroke-width="1.2" filter="url(#badgeShadow)" />
    <circle cx="16" cy="17" r="4.5" fill="#fd0461" />
    <text x="28" y="21" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="10" fill="#f3f4f6" font-weight="600">LG webOS 24+</text>
  </g>

  <g class="card-float-2" transform="translate(945, 252)">
    <rect x="0" y="0" width="140" height="34" rx="8" fill="url(#pillGrad)" stroke="#3b82f6" stroke-width="1.2" filter="url(#badgeShadow)" />
    <circle cx="16" cy="17" r="4.5" fill="#3b82f6" />
    <text x="28" y="21" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="10" fill="#f3f4f6" font-weight="600">Android TV / Tizen</text>
  </g>

  <g class="card-float-3" transform="translate(1060, 195)">
    <rect x="0" y="0" width="112" height="34" rx="8" fill="url(#pillGrad)" stroke="#10b981" stroke-width="1.2" filter="url(#badgeShadow)" />
    <circle cx="16" cy="17" r="4.5" fill="#10b981" />
    <text x="28" y="21" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="10" fill="#f3f4f6" font-weight="600">Native Homebrew</text>
  </g>

  <!-- FOREGROUND HERO CONTENT (Unobscured and sharply readable) -->
  <g transform="translate(60, 48)">
    <!-- Category Pill Tag -->
    <rect x="0" y="0" width="248" height="28" rx="14" fill="#1e1e2f" stroke="url(#accentGrad)" stroke-width="1.5" />
    <circle cx="14" cy="14" r="5" fill="#fd0461" />
    <text x="28" y="18" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11" fill="#e0e7ff" font-weight="700" letter-spacing="0.5">SMART TV OS &amp; LIVING-ROOM LAB</text>

    <!-- Main Title -->
    <text x="0" y="78" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="34" fill="#ffffff" font-weight="800" letter-spacing="-0.5">
      Awesome Smart TV OS &amp;
    </text>
    <text x="0" y="120" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="34" fill="url(#accentGrad)" font-weight="800" letter-spacing="-0.5">
      webOS Homebrew Launcher
    </text>

    <!-- Subtitle / Mission Statement -->
    <text x="0" y="162" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="14.5" fill="#cbd5e1" font-weight="400">
      The definitive directory of proprietary Smart TV platforms, open-source custom home screens,
    </text>
    <text x="0" y="186" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="14.5" fill="#94a3b8" font-weight="400">
      sideloading utilities, ambient lighting daemons &amp; living-room developer toolchains.
    </text>

    <!-- Key Pills / Capabilities -->
    <g transform="translate(0, 218)">
      <rect x="0" y="0" width="132" height="28" rx="6" fill="#111827" stroke="#374151" stroke-width="1" />
      <text x="14" y="18" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11" fill="#f3f4f6" font-weight="600">📺 LG webOS &amp; OSE</text>

      <rect x="142" y="0" width="144" height="28" rx="6" fill="#111827" stroke="#374151" stroke-width="1" />
      <text x="156" y="18" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11" fill="#f3f4f6" font-weight="600">🚀 Ad-Free Launchers</text>

      <rect x="296" y="0" width="124" height="28" rx="6" fill="#111827" stroke="#374151" stroke-width="1" />
      <text x="310" y="18" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11" fill="#f3f4f6" font-weight="600">🎮 Moonlight &amp; Kodi</text>

      <rect x="430" y="0" width="138" height="28" rx="6" fill="#111827" stroke="#374151" stroke-width="1" />
      <text x="444" y="18" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11" fill="#f3f4f6" font-weight="600">🔓 Root &amp; DevMode</text>
    </g>
  </g>
</svg>
